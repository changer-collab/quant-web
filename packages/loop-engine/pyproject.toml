[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantforge-loop"
version = "0.1.0"
description = "QuantForge 循环引擎 — 循环工程类型骨架与条件判断纯函数接口"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["quantforge_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
