[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantforge-ai"
version = "0.1.0"
description = "QuantForge AI 引擎 — 特征提取、模型训练、预测"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["quantforge_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
