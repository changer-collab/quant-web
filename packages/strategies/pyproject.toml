[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantforge-strategies"
version = "0.1.0"
description = "QuantForge 策略库 — 内置策略实现"
requires-python = ">=3.11"
dependencies = [
    "quantforge-ai",
    "quantforge-strategy",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["quantforge_strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
