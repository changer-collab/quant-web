[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantforge-data"
version = "0.1.0"
description = "QuantForge 数据客户端 — 轻量 SQLite 读取"
requires-python = ">=3.11"
dependencies = [
    "quantforge-strategy",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["quantforge_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
