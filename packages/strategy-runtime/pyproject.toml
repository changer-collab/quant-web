[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantforge-strategy"
version = "0.1.0"
description = "QuantForge 策略运行时 — 策略接口、订单类型、持仓、上下文等核心抽象"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quantforge = "quantforge_strategy.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["quantforge_strategy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
