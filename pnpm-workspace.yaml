packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# better-sqlite3 ships prebuilt binaries (no C++ build tools needed on Node 24).
# pnpm 9.x gates postinstall scripts by default, so the prebuild-install step
# that fetches the native binary must be explicitly allowed here.
# NOTE: Keep comments in ASCII to avoid encoding issues on Windows.
onlyBuiltDependencies:
  - "better-sqlite3"
